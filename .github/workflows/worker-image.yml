# Builds the public worker image (pool/Dockerfile: the Kangaroo solver + pool_agent.py) on GitHub's runners from this
# repository and pushes it to Docker Hub, so the image anyone pulls is built from code anyone can read, by a build
# anyone can watch. Every push to main that touches the image inputs builds adz23/kova-pool:sha-<commit>. The number
# in pool/IMAGE_TAG is pushed only if that tag does not exist yet: a numbered tag never changes once published, so
# bump pool/IMAGE_TAG to release a new one. BuildKit attaches SLSA provenance (source commit, Dockerfile, base
# images) and an SBOM to the image; check what a tag was built from with
#   docker buildx imagetools inspect adz23/kova-pool:8 --format '{{json .Provenance}}'
# Needs two repository secrets: DOCKERHUB_USERNAME (adz23) and DOCKERHUB_TOKEN (a Docker Hub access token, read &
# write). Every action is pinned to a commit, as in windows-worker.yml; the version is in the comment.
name: worker-image
on:
  push:
    branches: [main]
    paths:
      - pool/Dockerfile
      - pool/pool_agent.py
      - pool/IMAGE_TAG
      - kangaroo/**
      - CUDAMath.h
      - fmul32.h
      - .github/workflows/worker-image.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space (the CUDA devel image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h / | tail -1
      - name: Tags
        id: tags
        run: |
          TAG=$(tr -d '[:space:]' < pool/IMAGE_TAG)
          [[ "$TAG" =~ ^[0-9]+$ ]] || { echo "pool/IMAGE_TAG must hold a number, got '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Is the numbered tag still free?
        id: free
        run: |
          N="adz23/kova-pool:${{ steps.tags.outputs.tag }}"
          if docker manifest inspect "$N" >/dev/null 2>&1; then
            echo "$N already exists on Docker Hub and is never overwritten: only adz23/kova-pool:sha-${{ steps.tags.outputs.short }} is pushed. Bump pool/IMAGE_TAG to release a new number." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "numbered=" >> "$GITHUB_OUTPUT"
          else
            echo "numbered=$N" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: pool/Dockerfile
          push: true
          tags: |
            adz23/kova-pool:sha-${{ steps.tags.outputs.short }}
            ${{ steps.free.outputs.numbered }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Kova Pool worker
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT: ${{ steps.tags.outputs.short }}
          NUMBERED: ${{ steps.free.outputs.numbered }}
        run: |
          {
            echo "## adz23/kova-pool built from ${GITHUB_SHA}"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- tags: \`adz23/kova-pool:sha-${SHORT}\`${NUMBERED:+, \`${NUMBERED}\`}"
            echo "- verify: \`docker buildx imagetools inspect adz23/kova-pool@${DIGEST} --format '{{json .Provenance}}'\`"
          } >> "$GITHUB_STEP_SUMMARY"
