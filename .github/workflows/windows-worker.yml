# Builds the native Windows worker: kangaroo.exe (CUDA, from the same kangaroo.cu as the Linux image, via
# pool/windows/winpatch.py's build-time 128-bit shim) + KovaPool.exe (Go tray app), and publishes both as the assets of
# the rolling GitHub release "windows-latest". KovaPool downloads kangaroo.exe from that release on first run, so a
# Windows PC needs no Docker Desktop. Runs on pushes that touch the solver or the Windows app, or by hand.
name: windows-worker
on:
  push:
    branches: [main]
    paths: ["kangaroo/**", "CUDAMath.h", "fmul32.h", "pool/windows/**", ".github/workflows/windows-worker.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1          # cl.exe on PATH: nvcc's host compiler on Windows
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Patch a copy of the sources for MSVC
        run: python pool/windows/winpatch.py . build
      - name: Compile kangaroo.exe
        shell: pwsh
        working-directory: build
        run: |
          $G = @(); foreach ($a in 86, 89, 90, 100, 120) { $G += "-gencode"; $G += "arch=compute_$a,code=sm_$a" }
          $C = @("-O3", "-std=c++17", "-diag-suppress", "20014,20011", "--ptxas-options=-O3") + $G
          # run each nvcc step; on failure, surface the compiler's error lines as annotations (readable through the API)
          function Step($name, $cmdArgs) {
            Write-Host "== $name"
            $out = & nvcc @cmdArgs 2>&1 | ForEach-Object { "$_" }
            $out | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE) {
              $errs = $out | Where-Object { $_ -match "error|fatal|undefined|cannot" } | Select-Object -First 40
              if (-not $errs) { $errs = $out | Select-Object -Last 40 }
              foreach ($e in $errs) { Write-Host "::error title=$name::$($e -replace '[\r\n]',' ')" }
              exit $LASTEXITCODE
            }
          }
          Step "compile kangaroo.cu" ($C + @("-DCC_EOMUL", "-I.", "-Ikangaroo", "-c", "kangaroo/kangaroo.cu", "-o", "kangaroo.obj"))
          Step "compile RCGpuCore.cu" ($C + @("-Ikangaroo/rc", "-c", "kangaroo/rc/RCGpuCore.cu", "-o", "RCGpuCore.obj"))
          Step "compile rc_glue.cu" ($C + @("-Ikangaroo/rc", "-c", "kangaroo/rc/rc_glue.cu", "-o", "rc_glue.obj"))
          # delay-load the driver DLL so the exe starts (and --cpu works) on a machine without an NVIDIA driver
          Step "link kangaroo.exe" (@("-O3", "-std=c++17") + $G + @("kangaroo.obj", "RCGpuCore.obj", "rc_glue.obj", "-lcuda", "-Xlinker", "/DELAYLOAD:nvcuda.dll", "-Xlinker", "delayimp.lib", "-o", "kangaroo.exe"))
          Get-Item kangaroo.exe | Format-List Name, Length
          $deps = & dumpbin /dependents kangaroo.exe 2>&1 | Select-String "\.dll" | ForEach-Object { $_.ToString().Trim() }
          Write-Host "::notice title=kangaroo.exe DLL dependencies::$($deps -join ', ')"
          $delay = & dumpbin /dependents kangaroo.exe 2>&1 | Select-String -Context 0,6 "delay load" | Out-String
          Write-Host "::notice title=delay-load section::$($delay -replace '[\r\n]+',' ')"
      - name: Self-test on the CPU (no GPU on the runner)
        shell: pwsh
        working-directory: build
        run: |
          $lines = & .\kangaroo.exe --selftest --range 26 --cpu --threads 2 --seed 1 --report 999 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "::notice title=selftest exit code::$code ($($lines.Count) lines of output)"
          $out = $lines -join "`n"
          if ($out -notmatch "KEY FOUND") {
            foreach ($l in ($lines | Select-Object -First 25)) { Write-Host "::error title=selftest output::$l" }
            if (-not $lines) { Write-Host "::error title=selftest::no output at all: the exe did not start (exit $code; missing DLL? run 'dumpbin /dependents')" }
            exit 1
          }
          $sl = & .\kangaroo.exe --pubkey 030d282cf2ff536d2c42f105d0b8588821a915dc3f9a05bd98bb23af67a2e92a5b --start 0 --range 36 --cpu --threads 2 --species tame --dpstream --dp 6 --time 5 --report 999 2>&1 | ForEach-Object { "$_" }
          $scode = $LASTEXITCODE
          $dp = @($sl | Where-Object { $_ -match "^DP " }).Count
          Write-Host "tame-only streamed $dp DPs (exit $scode, $($sl.Count) lines)"
          Write-Host "::notice title=dp stream::$dp DP lines, exit $scode, $($sl.Count) lines total"
          foreach ($l in ($sl | Where-Object { $_ -notmatch "^DP " } | Select-Object -First 12)) { Write-Host "::notice title=dp stream output::$l" }
          if ($dp -lt 10) { Write-Host "::error title=dp stream::fewer than 10 DP lines"; exit 1 }
          exit 0   # the timed run exits 2 ("stopped without finding the key"), which is expected here
      - name: Build KovaPool.exe
        shell: pwsh
        working-directory: pool/windows
        run: go build -ldflags "-H windowsgui -s -w -X main.buildSHA=${{ github.sha }}" -o ../../build/KovaPool.exe .
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/kangaroo.exe dist/
          Copy-Item build/KovaPool.exe dist/
          New-Item -ItemType Directory -Force dist/rc | Out-Null
          Copy-Item build/kangaroo/rc/kernel_sm89.cubin, build/kangaroo/rc/kernel_sm89_sqr.cubin, build/kangaroo/rc/kernel_sm120.cubin, build/kangaroo/rc/LICENSE.TXT dist/rc/
          Compress-Archive -Path dist/kangaroo.exe, dist/rc -DestinationPath dist/kangaroo-windows.zip -Force
          "${{ github.sha }}" | Out-File -NoNewline dist/VERSION.txt
          Get-ChildItem -Recurse dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: kova-pool-windows, path: dist/ }
      - name: Publish to the rolling release "windows-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows worker (latest)
          body: "Built from ${{ github.sha }}. KovaPool.exe: the tray app (downloads kangaroo-windows.zip itself on first run). kangaroo-windows.zip: the solver for people who want to run it by hand."
          prerelease: true
          files: |
            dist/KovaPool.exe
            dist/kangaroo-windows.zip
            dist/VERSION.txt
